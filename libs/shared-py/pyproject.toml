[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gaia-shared"
version = "0.1.0"
description = "GAIA PRIME shared library"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "aiosqlite>=0.20",
]

[tool.setuptools.packages.find]
where = ["."]
